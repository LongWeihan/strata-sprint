<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="Strata Sprint, a PRO 6000 serving distribution. 38.3 times faster 32K conversation resumption versus the recorded Strata baseline.">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a211b"/><stop offset="1" stop-color="#132e26"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9fe9c1" stroke-opacity=".05"/></pattern><linearGradient id="flow"><stop stop-color="#294b3c"/><stop offset="1" stop-color="#92f0b9"/></linearGradient></defs>
<rect width="1280" height="420" rx="24" fill="url(#bg)"/><rect width="1280" height="420" rx="24" fill="url(#grid)"/>
<g fill="none" stroke="url(#flow)" stroke-width="2"><path d="M740 80h220q80 0 80 80v20q0 80 80 80h160"/><path d="M720 110h220q70 0 70 70v30q0 80 90 80h180"/><path d="M700 140h215q65 0 65 65v30q0 85 80 85h220"/></g>
<circle cx="1040" cy="156" r="5" fill="#99efbd"/><circle cx="980" cy="221" r="5" fill="#99efbd"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="54" y="64" fill="#96d6b1" font-size="13" font-weight="700" letter-spacing="3">PRO 6000 / QWEN IQ3_S / FP16 KV</text>
<text x="50" y="160" fill="#f1f8ed" font-size="76" font-weight="700" letter-spacing="-4">Strata Sprint</text><text x="54" y="210" fill="#c2d5c8" font-size="26">Keep the conversation moving.</text>
<text x="54" y="276" fill="#a5bdb0" font-size="17">Dedicated prefill buffers. Exact-state conversation parking.</text><text x="54" y="304" fill="#a5bdb0" font-size="17">A measured serving distribution built on Strata 0.1.43.</text>
<rect x="810" y="190" width="405" height="158" rx="18" fill="#071e16" stroke="#315a42"/><text x="839" y="258" fill="#a4f0bd" font-size="58" font-weight="700">38.3×</text><text x="841" y="294" fill="#e4efdf" font-size="18">faster 32K conversation resume</text><text x="841" y="324" fill="#8fad99" font-size="13">7.625 → 0.199 s · same-host HTTP · 12 returns</text>
<path d="M54 359H744" stroke="#315140"/><text x="54" y="389" fill="#8cab97" font-size="12">Versus the recorded Strata baseline. Decode throughput is essentially unchanged.</text></g></svg>
